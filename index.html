<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Login</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <main class="container">
    <!--Area de login-->
    <section class="login">
        <h1>Muanza Lopes Academy</h1>
        <div class="social">
            <a href="#"><img src="instagram.png" alt=""></a>
            <a href="#"><img src="youtube.png" alt=""></a>
            <a href="#"><img src="facebook.png" alt=""></a>
        </div>

        <p>Use o seu email e senha para o cadastro.</p>

        <form class="input-caixa" action="#">
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="email">
            </div>
        
            <div class="input-caixa">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="senha">
            </div>

            <a class="forgot" href="#">você esqueceu a sua senha?</a>

            <button type="submit">Iniciar a Sessão </button>
        </form>
    </section>

    <!--Area de boas vindas-->
    <section class="welcome">
        <h2>Seja bem-vindo a nossa Academia</h2>

        <p>Para se manter conectado no site da academia,faça um cadastro ou inicie a Sessão.</p>

        <button type="submit">Inscrever-se</button>

    </section>
</main>
</body>
</html>
